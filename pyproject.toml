[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fastcharge-login-interface"
version = "1.0.0"
description = "Interfaccia desktop per registrazione e controllo accessi visitatori"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "opencv-python>=4.10,<5",
    "python-dotenv>=1.0,<2",
    "Pillow>=10,<13",
    "qrcode>=7.4,<9",
]

[dependency-groups]
dev = ["ruff>=0.16,<0.17"]

[project.scripts]
fastcharge = "fastcharge.application:main"

[tool.setuptools.packages.find]
include = ["fastcharge*"]

[tool.ruff]
target-version = "py310"
line-length = 100
exclude = [".venv"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.ruff.format]
quote-style = "double"
